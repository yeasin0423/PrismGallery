name: Build release APK

# Builds the unsigned release APK on Linux with the same Java version as F-Droid's build server, so the result can
# be compared byte for byte with F-Droid's own build (reproducible build). The R8 code shrinker writes different
# line endings on Windows, so release builds meant for publishing are made here, not on a Windows PC.
# The APK is signed afterwards, on the maintainer's own computer; the signing key never leaves it.

on:
  workflow_dispatch:

permissions:
  # Required so the workflow can publish a GitHub release for the run.
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # services.gradle.org redirects to github.com/gradle/gradle-distributions, which occasionally
      # answers 504 and makes the wrapper fail before the build starts. The distribution is therefore
      # committed in 45 MB parts (GitHub rejects single files over 100 MB); rebuild it, verify it and
      # use it directly so no download is needed.
      - name: Restore the bundled Gradle distribution
        run: |
          cat gradle/wrapper/gradle-8.9-bin.zip.part-* > "$RUNNER_TEMP/gradle-8.9-bin.zip"
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  $RUNNER_TEMP/gradle-8.9-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build the unsigned release APK
        run: gradle assembleRelease --no-daemon

      - name: Show checksums
        run: sha256sum app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-unsigned-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      # Every workflow run publishes a (previously empty) GitHub release, so the maintainer can sign the
      # APK locally and attach it there. The APK itself is deliberately not uploaded: it is unsigned.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(awk -F'"' '/^[[:space:]]*versionName = / { print $2; exit }' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          TAG="v${VERSION_NAME}"
          TITLE="YS Gallery ${VERSION_NAME}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          BODY="Built from commit ${COMMIT_SHA}: ${COMMIT_SUBJECT}"
          if [ -n "$COMMIT_BODY" ]; then
            BODY="${BODY}"$'\n\n'"${COMMIT_BODY}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
          else
            gh release create "$TAG" --target "${{ github.sha }}" --title "$TITLE" --notes "$BODY"
          fi
